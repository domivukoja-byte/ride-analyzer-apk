name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Buildozer / p4a
        # key changes whenever the build config changes (so spec edits
        # invalidate the cache) but stays stable across pure code pushes.
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.local/share/python-for-android
          key: ${{ runner.os }}-buildozer-v9-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache git libffi-dev libssl-dev \
            libjpeg-dev zlib1g-dev autoconf libtool \
            automake libsqlite3-dev libstdc++6 libgomp1 \
            unzip wget

      - name: Pre-seed p4a package cache with Python 3.11
        # python.org intermittently returns HTTP 502 to GitHub's IP when
        # p4a tries to download the hostpython3 / python3 tarballs. Pre-
        # downloading here puts the file where buildozer's p4a expects
        # it and skips the network call entirely. With buildozer 1.5.0,
        # p4a (master branch) downloads CPython from GitHub:
        #   https://github.com/python/cpython/archive/refs/tags/v{version}.tar.gz
        # The tarball is named after the upstream URL basename.
        run: |
          BUILDOZER_PKG="$HOME/.buildozer/android/packages"
          mkdir -p "$BUILDOZER_PKG/hostpython3" "$BUILDOZER_PKG/python3"
          ok=false
          for url in \
            "https://github.com/python/cpython/archive/refs/tags/v3.11.tar.gz" \
            "https://www.python.org/ftp/python/3.11/Python-3.11.tar.xz" \
          ; do
            if wget -q --tries=3 --timeout=120 -O /tmp/v3.11.tar.gz "$url"; then
              echo "downloaded from $url ($(stat -c %s /tmp/v3.11.tar.gz) bytes)"
              ok=true
              break
            fi
            echo "wget failed for $url, trying next mirror"
          done
          if [ "$ok" != "true" ]; then
            echo "ERROR: could not download Python 3.11 tarball"
            exit 1
          fi
          for recipe in hostpython3 python3; do
            cp /tmp/v3.11.tar.gz "$BUILDOZER_PKG/$recipe/v3.11.tar.gz"
            cp /tmp/v3.11.tar.gz "$BUILDOZER_PKG/$recipe/Python-3.11.tar.xz"
            touch "$BUILDOZER_PKG/$recipe/.mark-v3.11.tar.gz"
            touch "$BUILDOZER_PKG/$recipe/.mark-Python-3.11.tar.xz"
            echo "seeded $recipe"
          done
          ls -la "$BUILDOZER_PKG/hostpython3/"
          ls -la "$BUILDOZER_PKG/python3/"

      - name: Install Cython 3.0.10
        # 3.0.10 is the last release before a segfault in p4a recipes
        # broke every build. Pin exactly.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython==3.0.10"

      - name: Install Buildozer
        run: python -m pip install "buildozer==1.5.0"

      - name: Build debug APK (auto-accept SDK licenses)
        env:
          # Yes-pipe the sdkmanager license prompt so p4a's android-sdk
          # install can complete without manual interaction.
          ANDROIDSDK: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
        run: |
          mkdir -p "$ANDROIDSDK/licenses"
          # Pre-accept the legacy license hashes (works for SDK < 34)
          cat > "$ANDROIDSDK/licenses/android-sdk-license" <<'EOF'

          8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF
          cat > "$ANDROIDSDK/licenses/android-sdk-preview-license" <<'EOF'

          84831b9409646a918e30573bab4c9c91346d8abd
          EOF
          cat > "$ANDROIDSDK/licenses/android-sdk-arm-dbt-license" <<'EOF'

          859f317696f67ef3d7f30a50a5560e7834b43903
          EOF
          cat > "$ANDROIDSDK/licenses/android-googletv-license" <<'EOF'

          601085b94cd77f0b54ff86406957099ebe79c4d6
          EOF
          cat > "$ANDROIDSDK/licenses/mips-android-sysimage-license" <<'EOF'

          e9acab5b5fbb560a72cfaecce8946896ff6aab9d
          EOF
          cat > "$ANDROIDSDK/licenses/android-sdk-system-image-license" <<'EOF'

          e9acab5b5fbb560a72cfaecce8946896ff6aab9d
          EOF
          # Newer SDK versions use a different license key file
          cat > "$ANDROIDSDK/licenses/android-sdk-license-android-35" <<'EOF'

          8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          EOF
          # Buildozer builds the APK; we pipe in a bounded stream of 'y'
          # so any remaining sdkmanager license prompts are auto-accepted.
          # A bounded loop (printf 1000 y's) is used instead of `yes` because
          # when buildozer exits, the unbounded `yes` gets SIGPIPE and that
          # exit-141 propagates through `set -e` (which GitHub Actions
          # enables by default on run: blocks), killing the whole step.
          # Retry up to 3 times for transient 502/503/504 errors.
          # On retry, clear partial downloads so the next attempt starts
          # from scratch.
          # set -x is OFF — its trace would dump 1000 echo y lines per
          # attempt, drowning the actual buildozer output in the GHA log.
          set +e  # critical: do NOT inherit GHA's implicit `set -e`
          attempt=1
          max=3
          while [ "$attempt" -le "$max" ]; do
            echo "==== Build attempt ${attempt}/${max} ===="
            if [ "$attempt" -gt 1 ]; then
              rm -rf .buildozer/android/packages 2>/dev/null || true
              find ~/.buildozer -name "*.partial" -delete 2>/dev/null || true
            fi
            # write buildozer's own output (which is very chatty) to
            # build.log. We feed stdin via Python so we can control the
            # size and timing of the y-stdin. A finite `for i in $(seq
            # 1 1000)` loop was tried first, but it ran out of y's
            # when sdkmanager asked for a second/third "Accept? (y/N):"
            # and then crashed waiting for input. An infinite stream
            # from `yes` also doesn't work because buildozer closes
            # stdin and `yes` gets SIGPIPE, which under GHA's implicit
            # `set -e` aborts the whole step. A Python generator
            # silently absorbs the broken-pipe signal.
            # The python process keeps writing y's forever; SIGPIPE
            # (raised when buildozer closes stdin) is ignored so the
            # python writer doesn't die with a non-zero exit code
            # that `set -e` would then catch.
            python -u yes_pipe.py | buildozer -v android debug > build.log 2>&1
            rc=$?
            echo "==== attempt ${attempt} exited rc=${rc} ===="
            if [ "$rc" -eq 0 ] && ls bin/*.apk 2>/dev/null >/dev/null; then
              echo "==== buildozer succeeded on attempt ${attempt} ===="
              break
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "==== final attempt failed (rc=${rc}) ===="
              break
            fi
            if grep -qE 'HTTP Error (502|503|504)' build.log; then
              echo "==== transient HTTP 5xx detected; retrying in 20s ===="
              sleep 20
            else
              echo "==== non-transient failure (rc=${rc}); not retrying ===="
              break
            fi
            attempt=$((attempt + 1))
          done
          if ! ls bin/*.apk 2>/dev/null >/dev/null; then
            echo "---- last 80 lines of build.log ----"
            tail -n 80 build.log
            echo "---- url / 502 mentions from full log ----"
            grep -E 'urlopen|HTTPError|Downloading|https?://|tar\.xz|tar\.gz|\.zip|\.aar' build.log | tail -n 200
            exit 1
          fi

      - name: List built artifacts
        run: ls -lh bin/ 2>/dev/null || true

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ride-analyzer-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 90
